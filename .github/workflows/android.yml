name: Android CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.2.0），相同版本号会覆盖旧的构建产物'
        required: true
        default: '0.2.0'
      delete_token:
        description: '可选：用于删除旧版本产物/Release 的 PAT（需 actions:write），留空则旧产物保留'
        required: false
        default: ''

env:
  APP_VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许创建 Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build core engine module
        run: ./gradlew :core:build

      - name: Assemble debug APK (version=${{ inputs.version }})
        run: ./gradlew :app:assembleDebug -PappVersionName=$APP_VERSION

      - name: Rename APK with version
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk              app/build/outputs/apk/debug/regman-v$APP_VERSION.apk

      - name: Delete previous artifact with same version
        if: ${{ inputs.delete_token != '' }}
        uses: geekyeggo/delete-artifact@v5
        with:
          name: regman-v${{ inputs.version }}.apk
          token: ${{ inputs.delete_token }}
          failOnError: false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: regman-v${{ inputs.version }}.apk
          path: app/build/outputs/apk/debug/regman-v${{ inputs.version }}.apk
          retention-days: 30

      # ── 发布 GitHub Release（同名版本先删旧 Release/Tag 再发，实现覆盖） ──
      - name: Delete old release/tag with same version
        if: ${{ inputs.delete_token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ inputs.delete_token }}
        run: |
          gh release delete "v${{ inputs.version }}" --yes --repo "$GITHUB_REPOSITORY" || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v${{ inputs.version }}" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: RegMan v${{ inputs.version }}
          files: app/build/outputs/apk/debug/regman-v${{ inputs.version }}.apk
          prerelease: true
          generate_release_notes: true
